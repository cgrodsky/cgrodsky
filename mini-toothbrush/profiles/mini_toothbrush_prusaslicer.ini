# Mini Toothbrush - PrusaSlicer / SuperSlicer print profile
# Tuned for a 0.4 mm nozzle and PLA. The bristle tufts are 1.6 mm pillars,
# so the key settings are fine layers, slow small perimeters and a minimum
# layer time that lets each tuft cool before the next layer.

# --- layers & perimeters ---
layer_height = 0.12
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 6
bottom_solid_layers = 4
fill_density = 25%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
thin_walls = 1
detect_thin_wall = 1
seam_position = rear
avoid_crossing_perimeters = 1
ensure_vertical_shell_thickness = 1

# --- extrusion widths (0.4 nozzle) ---
extrusion_width = 0.42
perimeter_extrusion_width = 0.42
external_perimeter_extrusion_width = 0.42
infill_extrusion_width = 0.45
first_layer_extrusion_width = 0.5

# --- speeds (mm/s) ---
perimeter_speed = 35
external_perimeter_speed = 20
small_perimeter_speed = 15
infill_speed = 60
solid_infill_speed = 45
top_solid_infill_speed = 30
first_layer_speed = 20
travel_speed = 150
bridge_speed = 25
gap_fill_speed = 20

# --- retraction / travel (reduces stringing between tufts) ---
retract_length = 0.8
retract_speed = 35
retract_lift = 0.2
retract_lift_above = 2.8
wipe = 1
retract_before_travel = 1

# --- support & adhesion: prints flat, no supports needed ---
support_material = 0
brim_width = 3
brim_type = outer_only
skirts = 1
skirt_distance = 4

# --- cooling ---
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 1
slowdown_below_layer_time = 12
min_print_speed = 8

# --- filament (PLA) ---
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
nozzle_diameter = 0.4
filament_diameter = 1.75

# --- optional two-tone: pause at the top of the head plate (Z = 2.76) and
#     swap to a white/blue filament for the bristles. Uncomment to use.
# pause_print_gcode = M600
# (then right-click the layer slider at 2.76 mm -> "Add color change")
