<meta http-equiv="Expires" content="0" />
<script>
/* Auto-updater: iOS Safari caches this index.html and then never sees the bumped
   ?v= script tags, so deploys never reach the device. Force one fresh load whenever
   the deployed build changes. BUILD stays in sync automatically — the deploy sed that
   bumps every v=... tag also rewrites the token inside this string. */
(function () {
  var BUILD = "v=260827g".slice(2); // -> current build id
  try {
    if (/[?&](code|state|error)=/.test(location.search)) return; // don't disturb auth0 redirects
    var u = new URL(location.href);
    if (u.searchParams.get("b") !== BUILD) {
      u.searchParams.set("b", BUILD);
      location.replace(u.href);
    }
  } catch (e) {}
})();
</script>

<!-- Three.js r160 as an ES module + the glTF/FBX loaders, all sharing ONE instance.
     We expose them on window so the app's classic scripts (which only touch THREE
     inside functions that run when an app is opened, never at load) keep working. -->
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { FBXLoader }  from 'three/addons/loaders/FBXLoader.js';
  window.THREE = THREE;
  window.GLTFLoader = GLTFLoader;
  window.FBXLoader = FBXLoader;
  window.__threeReady = true;
  window.dispatchEvent(new Event('three-ready'));
</script>
