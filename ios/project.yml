# XcodeGen project for the Windows 12 iPad app.
# Built by .github/workflows/ios.yml on a GitHub macOS runner:
#   the web files are copied into ios/Web, then `xcodegen generate` + `xcodebuild`.
# Dependencies: Xcode (on the runner) and XcodeGen (Homebrew). The app itself uses
# only Apple frameworks: UIKit, WebKit, LocalAuthentication.
name: Windows12
options:
  bundleIdPrefix: io.github.cgrodsky
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  Windows12:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Web
        type: folder          # copied into the app as the "Web" folder (offline copy of the site)
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Windows 12
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Windows 12 uses Face ID to unlock your desktop and confirm purchases.
        NSCameraUsageDescription: The Camera app and video calls in Windows 12 use the camera.
        NSMicrophoneUsageDescription: Voice features and recording in Windows 12 use the microphone.
        NSLocationWhenInUseUsageDescription: Weather and Maps in Windows 12 use your location.
        NSPhotoLibraryAddUsageDescription: Windows 12 can save pictures you download to Photos.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cgrodsky.windows12
        PRODUCT_NAME: Windows12
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
    scheme: {}
